<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d78" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d78" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2" />

  <!-- Interview Speech Bubble Shape -->
  <path d="M18 20C18 16.6863 20.6863 14 24 14H40C43.3137 14 46 16.6863 46 20V34C46 37.3137 43.3137 40 40 40H30L22 47V40H24H20C18.8954 40 18 39.1046 18 38V20Z"
        fill="url(#accentGrad)" opacity="0.15" />
  <path d="M18 20C18 16.6863 20.6863 14 24 14H40C43.3137 14 46 16.6863 46 20V34C46 37.3137 43.3137 40 40 40H30L22 47V40H20C18.8954 40 18 39.1046 18 38V20Z"
        stroke="url(#accentGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- AI Sparkle / Brain Nodes inside bubble -->
  <path d="M32 20L34 25.5L39.5 27.5L34 29.5L32 35L30 29.5L24.5 27.5L30 25.5L32 20Z"
        fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Secondary AI nodes -->
  <circle cx="25" cy="22" r="1.5" fill="#38bdf8" />
  <circle cx="39" cy="22" r="1.5" fill="#ec4899" />
  <circle cx="39" cy="33" r="1.5" fill="#a855f7" />

  <!-- Connection rays -->
  <line x1="25" y1="22" x2="30" y2="25.5" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 1" opacity="0.7" />
  <line x1="39" y1="22" x2="34" y2="25.5" stroke="#ec4899" stroke-width="1" stroke-dasharray="2 1" opacity="0.7" />
</svg>